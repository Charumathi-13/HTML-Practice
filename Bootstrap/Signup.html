<!DOCTYPE html>
<html>
<head>
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="Signup.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>
<body>
     <div class="row">

            <div class="col-7 leftwrap">
                <h1 class="wel">Welcome to</h1></br>
                <img class="one" src="./Images/One-rec-logo.svg"/></br>
                <img class="doc" src="./Images/Doctor.svg"/></br>
                <label class="man">Manage your Patients</label>
            </div>

            <div class="col-5" rightwrap>
                <div class="right">
                <label class="sig">Sign Up</label></br>
                <label class="word">We have Happy to be in our OneRec Portal.<br/>Sign in and explore OneRec</label><br/>
                <input type="text" placeholder="Firstname" class="firstinput"/>
                <input type="text" placeholder="Lastname" class="lastinput"/><br/>
                <input type="number" placeholder="Phone number" class="phoneinput">
                <input type="email" placeholder="Enter ur email" class="emailinput"/><br/>
                <input type="password" placeholder="Password" class="passinput"/>
                <input type="password" placeholder="Confirm Password" class="cpassinput"/><br/>
                <input type="text" placeholder="Hospital Name" class="hosinput"/><br/>       
                <input type="text" placeholder="State" class="stateinput">
                <input type="number" placeholder="Zip Code" class="zipinput"/><br/>
                <div class="check">
                    <input type="checkbox"/>
                <label class="me">I agree to all the terms and privacy policy</label><br/>  
                <button class="signin">Sign In</button>
                <button class="signup">Sign Up</button>
            </div>
            </div>
</body>

</html>
