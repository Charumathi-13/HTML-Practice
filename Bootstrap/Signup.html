<!DOCTYPE html>
<html>
<head>
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="Signup.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
</head>
<body>
     <div class="row">

            <div class="col-7 leftwrap">
                <h1 class="wel">Welcome to</h1></br>
                <img class="one" src="./Images/One-rec-logo.svg"/></br>
                <img class="doc" src="./Images/Doctor.svg"/></br>
                <label class="man">Manage your Patients</label>
            </div>

            <div class="col-5" rightwrap>
                <div class="right">
                <label class="sig">Sign Up</label></br>
                <label class="word">We have Happy to be in our OneRec Portal.<br/>Sign in and explore OneRec</label><br/>
                <input type="text" placeholder="Firstname" class="firstinput" id="firstname"/>
                <input type="text" placeholder="Lastname" class="lastinput" id="lastname"/><br/>
                <input type="number" placeholder="Phone number" class="phoneinput" id="phnumber">
                <input type="email" placeholder="Enter ur email" class="emailinput" id="emailid"/><br/>
                <input type="password" placeholder="Password" class="passinput" id="password"/>
                <input type="password" placeholder="Confirm Password" class="cpassinput" id="cpassword"/><br/>
                <input type="text" placeholder="Hospital Name" class="hosinput" id="hosname"/><br/>       
                <input type="text" placeholder="State" class="stateinput" id="statename">
                <input type="number" placeholder="Zip Code" class="zipinput" id="zipcode"/><br/>
                <div class="check">
                    <input type="checkbox" id="check"/>
                <label class="me">I agree to all the terms and privacy policy</label><br/>  
                <button class="signin">Sign In</button>
                <button class="signup" onclick="handleSignup()">Sign Up</button>
                    </div>
            </div>

                <script>
                    function handleSignup(){
                    let fname = document.getElementById("firstname").value
                    let lname = document.getElementById("lastname").value
                    let phonenumber = document.getElementById("phnumber").value
                    let emaill = document.getElementById("emailid").value
                    let pass = document.getElementById("password").value
                    let cpass = document.getElementById("cpassword").value
                    let hname = document.getElementById("hosname").value
                    let sname = document.getElementById("statename").value
                    let zname = document.getElementById("zipcode").value
                    let cname = document.getElementById("check").value

                    if(fname == '' || lname == '' || phonenumber == '' || emaill == '' || pass == '' || cpass == '' || hname == '' || sname == '' || zname == '' || cname == ''){
                        alert("Please fill in all fields!!!");
                    }else{
                        localStorage.setItem("EmailId" , emaill)
                        localStorage.setItem("Password" , pass)
                        alert("Signup Successfull!!!");
                        window.location.href = "Signin.html"
                    }
                }
                </script>

            
</body>

</html>
