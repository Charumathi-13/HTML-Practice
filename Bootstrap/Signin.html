<!DOCTYPE html>
<html>
    <head>
        <title>Sign In Page</title>
        <link rel="stylesheet" href="Signin.css">
         <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    </head>

    <body>
        <div class="row"> 

            <div class="col-7 leftwrap">
                <h1 class="wel">Welcome to</h1></br>
                <img class="one" src="./Images/One-rec-logo.svg"/></br>
                <img class="nur" src="./Images/Nurse.svg"/></br>
                <label class="man">Manage your Patients</label>
            </div>

            <div class="col-5" rightwrap>
                <div class="right">
                <label class="sig">Sign In</label></br>
                <label class="word">We have Happy to be in our OneRec Portal.<br/>Sign in and explore OneRec</label><br/>
                <!-- <label class="ema">Email Address</label><br/> -->
                <input type="email" placeholder="Enter ur email" class="emailinput"/><br/>
                <!-- <label class="pas">Password</label><br/> -->
                <input type="password" placeholder="Enter ur password" class="passwordinput"/><br/>
                <div class="check">
                    <input type="checkbox"/>
                <label class="me">Remember me</label>
                <label class="for">Forgot password ?</label><br/>
                    </div>
                <button class="signin">Sign In</button>
                <button class="signup">Sign Up</button>
            </div>
        </div>
    </body>
</html>
